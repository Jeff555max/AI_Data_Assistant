name: ai-data-assistant

services:
  web:
    build: .
    image: ai-data-assistant:latest
    container_name: data-assistant
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./storage/uploads:/app/storage/uploads
      - ./storage/outputs:/app/storage/outputs
    restart: unless-stopped
